<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07c160"/>
      <stop offset="100%" stop-color="#06ad56"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Solid house - filled, no strokes, bold at all sizes -->
  <g transform="translate(256, 270)">
    <!-- Roof (filled triangle) -->
    <polygon points="0,-130 -130,10 130,10" fill="#ffffff"/>
    <!-- Walls -->
    <rect x="-85" y="10" width="170" height="105" rx="6" fill="#ffffff"/>
    <!-- Door -->
    <rect x="-32" y="45" width="64" height="70" rx="6" fill="#07c160"/>
  </g>
</svg>
