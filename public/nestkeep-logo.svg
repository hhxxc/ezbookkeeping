<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#533afd"/>
      <stop offset="100%" stop-color="#3a25cc"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- White coin/circle -->
  <circle cx="256" cy="256" r="160" fill="#ffffff"/>

  <!-- Abstract "巢" / home shape - solid, high contrast -->
  <g transform="translate(256, 278)">
    <!-- Roof -->
    <path d="M-120,0 L0,-130 L120,0"
          fill="none" stroke="#3a25cc" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Walls -->
    <line x1="-88" y1="0" x2="-88" y2="80" stroke="#3a25cc" stroke-width="22" stroke-linecap="round"/>
    <line x1="88" y1="0" x2="88" y2="80" stroke="#3a25cc" stroke-width="22" stroke-linecap="round"/>
    <!-- Door -->
    <rect x="-30" y="20" width="60" height="60" rx="8" fill="#3a25cc"/>
  </g>
</svg>
