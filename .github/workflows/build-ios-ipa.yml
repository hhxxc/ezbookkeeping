name: Build iOS IPA (TrollStore)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API base URL (e.g. https://example.com or https://example.com/nestkeep)'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Force hash routing for Capacitor
        run: |
          sed -i '' 's|browserHistory: !isiOSHomeScreenMode()|browserHistory: false|' src/MobileApp.vue

      - name: Build web
        run: npm run build

      # Capacitor loads index.html by default, but the mobile entry is mobile.html
      - name: Prepare Capacitor entry
        run: cp dist/mobile.html dist/index.html

      # Inject remote API base URL so the local app knows where the backend is
      - name: Inject server settings
        run: |
          cat > dist/server_settings.js << 'EOF'
          window.EZBOOKKEEPING_SERVER_SETTINGS = window.EZBOOKKEEPING_SERVER_SETTINGS || {};
          window.EZBOOKKEEPING_SERVER_SETTINGS.apiBaseUrl = '${{ inputs.api_base_url }}';
          EOF

      - name: Install Capacitor iOS
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7

      - name: Add iOS platform
        run: test -d ios || npx cap add ios

      - name: Use hash-based routing for Capacitor compatibility
        run: |
          cat > capacitor.config.ts << 'CFGEOF'
          import { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
              appId: 'com.nestkeep.app',
              appName: '巢记',
              webDir: 'dist',
              server: {
                  iosScheme: 'capacitor'
              }
          };
          export default config;
          CFGEOF

      # Inject inline debug: error alerts + visible "LOADED" marker to confirm rendering
      - name: Inject debug panel
        run: |
          sed -i '' 's@<head>@<head><script>window.onerror=function(m,s,l,c,e){alert("JS:"+m+"\\n"+s+":"+l)};window.addEventListener("unhandledrejection",function(e){alert("P:"+e.reason)});document.addEventListener("DOMContentLoaded",function(){var d=document.createElement("div");d.style.cssText="position:fixed;top:0;left:0;z-index:99999;background:red;color:#fff;padding:4px 8px;font-size:12px;font-family:sans-serif";d.textContent="LOADED|path="+location.pathname+"|href="+location.href+"|UA="+navigator.userAgent.substring(0,50);document.body.appendChild(d)})<\/script>@' dist/index.html

      - name: Sync iOS platform
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: Build iOS
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "App.xcarchive/Products/Applications/App.app" Payload/
          codesign -s - --force --deep "Payload/App.app"
          zip -r nestkeep.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nestkeep-ios-ipa
          path: nestkeep.ipa
