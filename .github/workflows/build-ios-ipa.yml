name: Build iOS IPA (TrollStore)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API base URL (e.g. https://example.com or https://example.com/nestkeep)'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Install Capacitor iOS
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7

      - name: Add iOS platform
        run: test -d ios || npx cap add ios

      # Load from remote URL to avoid CORS issues (local capacitor:// vs remote https://)
      - name: Configure remote URL
        run: |
          cat > capacitor.config.ts << 'CFGEOF'
          import { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
              appId: 'com.nestkeep.app',
              appName: '巢记',
              webDir: 'dist',
              server: {
                  url: '${{ inputs.api_base_url }}',
                  cleartext: true
              }
          };
          export default config;
          CFGEOF

      - name: Sync iOS platform
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: Build iOS
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "App.xcarchive/Products/Applications/App.app" Payload/
          codesign -s - --force --deep "Payload/App.app"
          zip -r nestkeep.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nestkeep-ios-ipa
          path: nestkeep.ipa
