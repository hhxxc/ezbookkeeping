name: Build iOS IPA (TrollStore)

on:
  push:
    branches:
      - main
    paths:
      - 'ios-shell/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-ios-ipa.yml'
      - 'public/nestkeep-logo.svg'
      - 'src/lib/web.ts'
      - 'src/lib/server_settings.ts'
  workflow_dispatch:
    inputs:
      pack_mode:
        description: 'Pack mode: local = bundle web into IPA (default), remote = load NAS web via server.url'
        required: false
        type: choice
        options:
          - local
          - remote
        default: 'local'
      api_base_url:
        description: 'Backend API base URL. local mode: API the bundled web app connects to; remote mode: the web server to load'
        required: false
        type: string
        default: ''
      fallback_api_base_url:
        description: 'Optional fallback server base URL (e.g. LAN address)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate version
        id: version
        run: |
          MAJOR=1
          MINOR=6
          PATCH=$(printf "%02d" $((${{ github.run_number }} / 100)))
          BUILD=$(printf "%02d" $((${{ github.run_number }} % 100)))
          echo "version=${MAJOR}.${MINOR}.${PATCH}.${BUILD}" >> "$GITHUB_OUTPUT"
          echo "tag=v${MAJOR}.${MINOR}.${PATCH}.${BUILD}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update package.json version
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${{ steps.version.outputs.version }}';
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Verify app shell detection
        run: |
          grep -q 'isAppShellMode' src/MobileApp.vue
          grep -q 'isAppShellMode' src/lib/ui/mobile.ts

      - name: Build web
        run: npm run build

      - name: Prepare Capacitor entry
        env:
          PACK_MODE: ${{ inputs.pack_mode || 'local' }}
          API_BASE_URL: ${{ inputs.api_base_url || vars.IOS_API_BASE_URL || 'https://example-server.invalid' }}
          SHELL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f ios-shell/index.html

          if [ "$PACK_MODE" = "remote" ]; then
            echo "Remote mode: use ios-shell as jump shell"
            cp ios-shell/index.html dist/index.html
            node -e "
              const fs = require('fs');
              const file = 'dist/index.html';
              let html = fs.readFileSync(file, 'utf8');
              html = html.split('__NESTKEEP_DEFAULT_SERVER__').join(process.env.API_BASE_URL || '');
              html = html.split('__NESTKEEP_FALLBACK_SERVER__').join('');
              html = html.split('__NESTKEEP_SHELL_VERSION__').join(process.env.SHELL_VERSION || '');
              fs.writeFileSync(file, html);
            "
            grep -q '__NESTKEEP_DEFAULT_SERVER__\|__NESTKEEP_SHELL_VERSION__' dist/index.html && { echo "ERROR: unreplaced placeholders in app shell"; exit 1; }
            echo "Remote server: ${API_BASE_URL}"
          else
            echo "Local mode: inject API base + copy diagnostic page"
            node -e "
              const fs = require('fs');
              const file = 'dist/index.html';
              let html = fs.readFileSync(file, 'utf8');
              const inject = '<script>window.EZBOOKKEEPING_SERVER_SETTINGS={apiBaseUrl:\"'+process.env.API_BASE_URL+'\"};</script>';
              html = html.replace('</head>', inject + '\n</head>');
              fs.writeFileSync(file, html);
            "
            cp ios-shell/index.html dist/shell-diag.html
            echo "API base URL: ${API_BASE_URL}"
          fi
          echo "Shell version: ${SHELL_VERSION}"

      - name: Install Capacitor iOS
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7

      - name: Add iOS platform
        env:
          PACK_MODE: ${{ inputs.pack_mode || 'local' }}
          NESTKEEP_SHELL_SERVER_URL: ${{ inputs.api_base_url || vars.IOS_API_BASE_URL || 'https://example-server.invalid' }}
          NESTKEEP_SHELL_VERSION: ${{ steps.version.outputs.version }}
        run: test -d ios || npx cap add ios

      - name: Sync iOS platform
        env:
          PACK_MODE: ${{ inputs.pack_mode || 'local' }}
          NESTKEEP_SHELL_SERVER_URL: ${{ inputs.api_base_url || vars.IOS_API_BASE_URL || 'https://example-server.invalid' }}
          NESTKEEP_SHELL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$PACK_MODE" = "remote" ]; then
            npx cap sync ios
            echo "--- capacitor.config.json (remote) ---"
            cat ios/App/App/capacitor.config.json
            grep -q '"url"' ios/App/App/capacitor.config.json || { echo "ERROR: server.url not injected"; exit 1; }
          else
            npx cap sync ios
            echo "--- capacitor.config.json (local) ---"
            cat ios/App/App/capacitor.config.json
            if grep -q '"url"' ios/App/App/capacitor.config.json; then
              echo "ERROR: server.url should NOT be set in local mode"; exit 1
            fi
            echo "OK: local mode, no server.url (WebView loads bundled dist)"
          fi

      - name: Patch Info.plist (allow webview to load http/LAN servers, enable high refresh rate)
        run: |
          PLIST="ios/App/App/Info.plist"
          PB=/usr/libexec/PlistBuddy

          $PB -c "Delete :NSAppTransportSecurity" "$PLIST" >/dev/null 2>&1 || true
          $PB -c "Add :NSAppTransportSecurity dict" "$PLIST"
          $PB -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool false" "$PLIST"
          $PB -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent bool true" "$PLIST"
          $PB -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"

          # 解锁 ProMotion 高刷：iOS 默认把第三方 App（含 WKWebView）钉在 60fps，
          # 该 key 允许 App 按设备支持的最高帧率渲染（iPhone 13 Pro 起 120Hz，iOS 15+）。
          # 注意：iOS 15.0~15.3 的 WebKit 没有解锁 WKWebView 120Hz 的私有接口
          # （见 scripts/ios-shell-unlock.swift），升级到 iOS 16+ 才会真正生效。
          $PB -c "Delete :CADisableMinimumFrameDurationOnPhone" "$PLIST" >/dev/null 2>&1 || true
          $PB -c "Add :CADisableMinimumFrameDurationOnPhone bool true" "$PLIST"

          $PB -c "Delete :NSCameraUsageDescription" "$PLIST" >/dev/null 2>&1 || true
          $PB -c "Add :NSCameraUsageDescription string 巢记需要使用相机拍摄小票照片用于记账" "$PLIST"
          $PB -c "Delete :NSPhotoLibraryUsageDescription" "$PLIST" >/dev/null 2>&1 || true
          $PB -c "Add :NSPhotoLibraryUsageDescription string 巢记需要访问照片图库以选择小票图片用于 AI 识别记账" "$PLIST"
          $PB -c "Delete :NSPhotoLibraryAddUsageDescription" "$PLIST" >/dev/null 2>&1 || true
          $PB -c "Add :NSPhotoLibraryAddUsageDescription string 巢记需要将识别相关图片保存到照片图库" "$PLIST"

          $PB -c "Print :NSAppTransportSecurity" "$PLIST"
          $PB -c "Print :CADisableMinimumFrameDurationOnPhone" "$PLIST"
          $PB -c "Print :NSCameraUsageDescription" "$PLIST"
          $PB -c "Print :NSPhotoLibraryUsageDescription" "$PLIST"
          $PB -c "Print :NSPhotoLibraryAddUsageDescription" "$PLIST"

      - name: Inject 120Hz unlock into AppDelegate
        run: |
          node scripts/ios-shell-fps-inject.js
          grep -n "ShellFpsInjection.start()" ios/App/App/AppDelegate.swift
          grep -c "class ShellFps" ios/App/App/AppDelegate.swift

      - name: Generate iOS App Icons
        run: |
          npm install --no-save sharp
          node -e "
            const fs = require('fs');
            const sharp = require('sharp');
            let svg = fs.readFileSync('public/nestkeep-logo.svg', 'utf8');
            svg = svg.replace(/x=\"16\" y=\"16\" width=\"480\" height=\"480\" rx=\"112\"/g, 'x=\"0\" y=\"0\" width=\"512\" height=\"512\" rx=\"0\"');
            sharp(Buffer.from(svg)).resize(1024,1024).png().toFile('/tmp/icon.png');
          "
          DST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$DST"
          for s in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
            sips -z $s $s /tmp/icon.png --out "$DST/icon-${s}.png"
          done
          cat > "$DST/Contents.json" << 'EOF'
          {
            "images": [
              { "size": "20x20", "idiom": "iphone", "filename": "icon-40.png", "scale": "2x" },
              { "size": "20x20", "idiom": "iphone", "filename": "icon-60.png", "scale": "3x" },
              { "size": "29x29", "idiom": "iphone", "filename": "icon-58.png", "scale": "2x" },
              { "size": "29x29", "idiom": "iphone", "filename": "icon-87.png", "scale": "3x" },
              { "size": "40x40", "idiom": "iphone", "filename": "icon-80.png", "scale": "2x" },
              { "size": "40x40", "idiom": "iphone", "filename": "icon-120.png", "scale": "3x" },
              { "size": "60x60", "idiom": "iphone", "filename": "icon-120.png", "scale": "2x" },
              { "size": "60x60", "idiom": "iphone", "filename": "icon-180.png", "scale": "3x" },
              { "size": "20x20", "idiom": "ipad", "filename": "icon-20.png", "scale": "1x" },
              { "size": "20x20", "idiom": "ipad", "filename": "icon-40.png", "scale": "2x" },
              { "size": "29x29", "idiom": "ipad", "filename": "icon-29.png", "scale": "1x" },
              { "size": "29x29", "idiom": "ipad", "filename": "icon-58.png", "scale": "2x" },
              { "size": "40x40", "idiom": "ipad", "filename": "icon-40.png", "scale": "1x" },
              { "size": "40x40", "idiom": "ipad", "filename": "icon-80.png", "scale": "2x" },
              { "size": "76x76", "idiom": "ipad", "filename": "icon-76.png", "scale": "1x" },
              { "size": "76x76", "idiom": "ipad", "filename": "icon-152.png", "scale": "2x" },
              { "size": "83.5x83.5", "idiom": "ipad", "filename": "icon-167.png", "scale": "2x" },
              { "size": "1024x1024", "idiom": "ios-marketing", "filename": "icon-1024.png", "scale": "1x" }
            ],
            "info": { "version": 1, "author": "xcode" }
          }
          EOF

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: Build iOS
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "App.xcarchive/Products/Applications/App.app" Payload/
          codesign -s - --force --deep "Payload/App.app"
          zip -r nestkeep.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nestkeep-ios-ipa
          path: nestkeep.ipa

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          gh release create "${TAG}" \
            --title "巢记 v${VERSION}" \
            --notes "巢记 v${VERSION} 自动构建" \
            --target "${{ github.sha }}" \
            nestkeep.ipa

      - name: Cleanup old releases (keep latest 20)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASES=$(gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName')
          KEEP=20
          COUNT=0
          echo "$RELEASES" | while read -r TAG; do
            [ -z "$TAG" ] && continue
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt $KEEP ]; then
              echo "Deleting old release $TAG"
              gh release delete "$TAG" --yes || true
            fi
          done
