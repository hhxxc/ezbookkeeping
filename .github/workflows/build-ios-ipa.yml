name: Build iOS IPA (TrollStore)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API base URL (overrides IOS_API_BASE_URL variable)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: macos-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Use hash-based routing for Capacitor compatibility (pushState conflicts with capacitor:// scheme)
      - name: Force hash routing
        run: |
          sed -i '' 's|browserHistory: !isiOSHomeScreenMode()|browserHistory: false|' src/MobileApp.vue

      - name: Build web
        run: npm run build

      # Capacitor loads index.html by default; mobile.html is the mobile entry point
      - name: Prepare Capacitor entry
        run: cp dist/mobile.html dist/index.html

      - name: Inject server settings
        env:
          API_URL: ${{ inputs.api_base_url || vars.IOS_API_BASE_URL }}
        run: |
          printf "window.EZBOOKKEEPING_SERVER_SETTINGS = window.EZBOOKKEEPING_SERVER_SETTINGS || {};\nwindow.EZBOOKKEEPING_SERVER_SETTINGS.apiBaseUrl = '%s';\n" "${API_URL}" > dist/server_settings.js

      - name: Install Capacitor iOS
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7

      - name: Add iOS platform
        run: test -d ios || npx cap add ios

      - name: Sync iOS platform
        run: npx cap sync ios

      - name: Generate iOS App Icons
        run: |
          npm install --no-save sharp
          node -e "
            const fs = require('fs');
            const sharp = require('sharp');
            let svg = fs.readFileSync('public/nestkeep-logo.svg', 'utf8');
            svg = svg.replace(/x=\"16\" y=\"16\" width=\"480\" height=\"480\" rx=\"112\"/g, 'x=\"0\" y=\"0\" width=\"512\" height=\"512\" rx=\"0\"');
            sharp(Buffer.from(svg)).resize(1024,1024).png().toFile('/tmp/icon.png');
          "
          DST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$DST"
          for s in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
            sips -z $s $s /tmp/icon.png --out "$DST/icon-${s}.png"
          done
          cat > "$DST/Contents.json" << 'EOF'
          {
            "images": [
              { "size": "20x20", "idiom": "iphone", "filename": "icon-40.png", "scale": "2x" },
              { "size": "20x20", "idiom": "iphone", "filename": "icon-60.png", "scale": "3x" },
              { "size": "29x29", "idiom": "iphone", "filename": "icon-58.png", "scale": "2x" },
              { "size": "29x29", "idiom": "iphone", "filename": "icon-87.png", "scale": "3x" },
              { "size": "40x40", "idiom": "iphone", "filename": "icon-80.png", "scale": "2x" },
              { "size": "40x40", "idiom": "iphone", "filename": "icon-120.png", "scale": "3x" },
              { "size": "60x60", "idiom": "iphone", "filename": "icon-120.png", "scale": "2x" },
              { "size": "60x60", "idiom": "iphone", "filename": "icon-180.png", "scale": "3x" },
              { "size": "20x20", "idiom": "ipad", "filename": "icon-20.png", "scale": "1x" },
              { "size": "20x20", "idiom": "ipad", "filename": "icon-40.png", "scale": "2x" },
              { "size": "29x29", "idiom": "ipad", "filename": "icon-29.png", "scale": "1x" },
              { "size": "29x29", "idiom": "ipad", "filename": "icon-58.png", "scale": "2x" },
              { "size": "40x40", "idiom": "ipad", "filename": "icon-40.png", "scale": "1x" },
              { "size": "40x40", "idiom": "ipad", "filename": "icon-80.png", "scale": "2x" },
              { "size": "76x76", "idiom": "ipad", "filename": "icon-76.png", "scale": "1x" },
              { "size": "76x76", "idiom": "ipad", "filename": "icon-152.png", "scale": "2x" },
              { "size": "83.5x83.5", "idiom": "ipad", "filename": "icon-167.png", "scale": "2x" },
              { "size": "1024x1024", "idiom": "ios-marketing", "filename": "icon-1024.png", "scale": "1x" }
            ],
            "info": { "version": 1, "author": "xcode" }
          }
          EOF

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: Build iOS
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "App.xcarchive/Products/Applications/App.app" Payload/
          codesign -s - --force --deep "Payload/App.app"
          zip -r nestkeep.ipa Payload

      - name: Generate version.json
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date +%s)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_hash=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: Cleanup old IPA artifacts (keep latest 20)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACTS=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=nestkeep-ios-ipa&per_page=100" --jq '.artifacts | sort_by(.created_at) | reverse | .[].id')
          KEEP=19
          COUNT=0
          echo "$ARTIFACTS" | while read -r ID; do
            [ -z "$ID" ] && continue
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt $KEEP ]; then
              echo "Deleting old IPA artifact #$ID"
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID" -X DELETE --silent || true
            fi
          done

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nestkeep-ios-ipa
          path: nestkeep.ipa

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${GITHUB_REF_NAME}"

          # Create release
          gh release create "${TAG}" \
            --title "巢记 v${VERSION}" \
            --notes "巢记 v${VERSION} 发布，请通过 TrollStore 安装。" \
            nestkeep.ipa

          # Upload version.json for auto-update
          IPA_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/nestkeep.ipa"
          cat > version.json << EOF
          {
            "latestVersion": "${VERSION}",
            "commitHash": "${{ steps.version.outputs.commit_hash }}",
            "buildTime": "${{ steps.version.outputs.build_time }}",
            "ipaDownloadUrl": "${IPA_DOWNLOAD_URL}",
            "releaseNotes": "巢记 v${VERSION}"
          }
          EOF
          gh release upload "${TAG}" version.json --clobber
