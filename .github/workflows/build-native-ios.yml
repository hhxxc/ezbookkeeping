name: Build NestKeep Native IPA (TrollStore)

# 原生 iOS App（SwiftUI）云端构建：在 GitHub 托管的 macOS 运行机上用 Xcode 编译，
# 产出 IPA 供 TrollStore 安装。无需本地 Mac、无需付费开发者证书。
#
# 触发：
#   - 推送 native-ios-app 且改动 ios-app/ 下任何文件或本工作流时自动构建，
#     **并自动发一个语义版本 Release**（版本号 = 本变体现有最大语义版本的 patch+1），
#     供 App 内「检查更新」识别到新版本。这样每次 push 完，手机端一键更新即可拿到。
#   - 推送 main（Web 后端）时仅上传 Artifact，不发版。
#   - 手动 workflow_dispatch：可指定 app_version 跳版本（如 1.7.0）；填了才会用指定版本发版，
#     留空则同样按 patch+1 自动推进。
#
# 变体（flavor）：
#   dev    → 巢记+        Bundle ID com.nestkeep.app.dev     （日常开发用）
#   stable → 巢记+ 稳定版  Bundle ID com.nestkeep.app.stable （长期稳定用）
#   两者 Bundle ID 不同，可同时安装、互不覆盖；更新清单也各自独立。
#   注意：网页壳（Capacitor）是第三个 App，Bundle ID com.nestkeep.app，本工作流不涉及。
#
# 出包文件名：NestKeep-<flavor>-<分支名>-<运行号>.ipa
# 出包后：在手机上用 TrollStore 打开对应 IPA 即可安装（会重新签名、永久驻留）。

on:
  push:
    branches:
      - main
      - native-ios-app
    # 关键提示：packages 里写 'ios-app/**' 覆盖该目录下全部文件（含 Info.plist、
    # gen_pbxproj.py、Assets.xcassets）。若以后要新增其他关键文件，务必一并列入。
    paths:
      - 'ios-app/**'
      - '.github/workflows/build-native-ios.yml'
  workflow_dispatch:
    inputs:
      make_release:
        description: '同时创建一个 GitHub Release（拿到永久直链，便于 TrollStore 打开）'
        required: false
        type: boolean
        default: true
      app_version:
        description: '语义化版本号（如 1.6.1）；填了才会额外发一个 vX.Y.Z 的 Release，供 App 内自动更新检测识别。留空则只发 nestkeep-ipa-N 环境包'
        required: false
        type: string
        default: ''
      flavor:
        description: '构建哪个变体：dev=巢记+（开发版，com.nestkeep.app.dev）/ stable=巢记+ 稳定版（com.nestkeep.app.stable）。两者可同时安装，互不覆盖'
        required: false
        type: choice
        options:
          - dev
          - stable
        default: dev

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: macos-latest
    env:
      FLAVOR: ${{ github.event.inputs.flavor || 'dev' }}
      IPA_NAME: NestKeep-${{ github.event.inputs.flavor || 'dev' }}-${{ github.ref_name }}-${{ github.run_number }}.ipa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve flavor (bundle id / display name)
        id: flavor
        run: |
          # dev / stable 两个变体必须用不同 Bundle ID，否则 iOS 按 ID 识别会互相覆盖，
          # 无法同时安装（这正是「一键更新会覆盖旧版」的根因之一）。
          case "$FLAVOR" in
            stable)
              echo "bundle_id=com.nestkeep.app.stable" >> "$GITHUB_OUTPUT"
              echo "display_name=巢记+ 稳定版" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "bundle_id=com.nestkeep.app.dev" >> "$GITHUB_OUTPUT"
              echo "display_name=巢记+" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "==> 变体 $FLAVOR"

      - name: Apply bundle id & display name into Info.plist / pbxproj
        working-directory: ios-app
        run: |
          # 直接写 Info.plist 与 pbxproj 的取值，而不是依赖仓库里的静态值，
          # 保证无论仓库当前是什么状态，产物一定是本变体应有的 ID 与显示名。
          PLIST="NestKeep/Info.plist"
          BID="${{ steps.flavor.outputs.bundle_id }}"
          NAME="${{ steps.flavor.outputs.display_name }}"

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $NAME" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $NAME" "$PLIST"

          # LSApplicationQueriesSchemes 必须含 apple-magnifier，否则 canOpenURL 恒 false；
          # 即便当前代码不依赖它做判断，也一并保证存在（TrollStore 安装入口用）。
          /usr/libexec/PlistBuddy -c "Print :LSApplicationQueriesSchemes" "$PLIST" >/dev/null 2>&1 || \
            /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          if ! /usr/libexec/PlistBuddy -c "Print :LSApplicationQueriesSchemes" "$PLIST" | grep -q "apple-magnifier"; then
            /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string apple-magnifier" "$PLIST"
          fi

          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $BID;/g" \
            NestKeep.xcodeproj/project.pbxproj

          echo "==> Info.plist:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST"
          echo "==> pbxproj:"
          grep -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' NestKeep.xcodeproj/project.pbxproj

      - name: Compute app version (auto patch+1 on push, or manual on dispatch)
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 统一在此决定本次构建的语义版本号：
          #   - workflow_dispatch 传了 app_version -> 用它（支持手动跳大版本，如 1.7.0）
          #   - 否则（push 到 native-ios-app / main）-> 自动取「本变体现有最大语义版本」的 patch+1，
          #     这样每次 push 都会产出一个比上一版更大的新版本，App 内「检查更新」就能查到。
          #
          # 版本号只写进 CFBundleShortVersionString（纯三段 x.y.z），构建号（CFBundleVersion）
          # 单独用 run_number。绝不把运行号拼进版本号——那会让 1.6.3.16 被判成「新于」1.6.3，
          # 导致永远提示有更新（历史教训）。
          SUFFIX=""
          if [ "$FLAVOR" = "stable" ]; then SUFFIX="-stable"; fi

          MANUAL="${{ github.event.inputs.app_version }}"
          if [ -n "$MANUAL" ]; then
            V="${MANUAL#v}"
            echo "==> 使用手动指定版本 $V"
          else
            # 查本变体现有语义版本 tag（vX.Y.Z 或 vX.Y.Z-stable），取最大 patch
            LATEST="$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name' \
              | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+${SUFFIX}\$" \
              | sed -E "s/^v//; s/${SUFFIX}\$//" \
              | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
            # 没有任何语义版本 tag 时，从仓库基线（gen_pbxproj.py / Info.plist 的 MARKETING_VERSION）起步
            if [ -z "$LATEST" ]; then
              LATEST="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ios-app/NestKeep/Info.plist)"
            fi
            V="$(echo "$LATEST" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')"
            echo "==> 自动推进版本：$LATEST -> $V"
          fi
          # 健壮性：极端情况下 V 仍为空则回退基线
          if [ -z "$V" ]; then V="1.6.3"; fi
          echo "app_version=$V" >> "$GITHUB_OUTPUT"
          echo "tag_suffix=$SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Inject app version into Info.plist
        working-directory: ios-app
        run: |
          # 版本号必须真实写进 App 包，否则 App 内「我的」永远显示基线值，
          # 用户无法判断自己装的是哪一版。
          PLIST="NestKeep/Info.plist"
          V="${{ steps.version.outputs.app_version }}"
          B="${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $V" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $B" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $B" "$PLIST"
          echo "==> App 版本注入为 $V ($B)"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST"
          # 同步到工程设置，避免 MARKETING_VERSION 与 Info.plist 不一致
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = $V;/g" NestKeep.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $B;/g" NestKeep.xcodeproj/project.pbxproj

      - name: Build app (ad-hoc signed, no Apple cert needed)
        working-directory: ios-app
        run: |
          xcodebuild build \
            -project NestKeep.xcodeproj \
            -scheme NestKeep \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/dd \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA (TrollStore will re-sign on device)
        working-directory: ios-app
        run: |
          APP="build/dd/Build/Products/Release-iphoneos/NestKeep.app"
          mkdir -p Payload
          cp -r "$APP" Payload/

          # 新版 Xcode 的 actool 不再向 App 包输出实体图标 PNG（只留 Assets.car 里的编译结果），
          # 而 CFBundleIconFiles 指向的那些 loose PNG 会变成全透明占位图 -> 主屏显示白块。
          # 这里直接把真实图标 PNG 覆盖进 App 包，文件名对齐 Info.plist 的 CFBundleIconFiles。
          ICONSET="NestKeep/Assets.xcassets/AppIcon.appiconset"
          cp "$ICONSET/icon-60x60@2x.png" Payload/NestKeep.app/AppIcon60x60@2x.png
          cp "$ICONSET/icon-60x60@3x.png" Payload/NestKeep.app/AppIcon60x60@3x.png
          cp "$ICONSET/icon-76x76@2x.png" Payload/NestKeep.app/AppIcon76x76@2x~ipad.png
          cp "$ICONSET/icon-40x40@2x.png" Payload/NestKeep.app/AppIcon40x40@2x.png
          cp "$ICONSET/icon-40x40@3x.png" Payload/NestKeep.app/AppIcon40x40@3x.png
          cp "$ICONSET/icon-29x29@2x.png" Payload/NestKeep.app/AppIcon29x29@2x.png
          cp "$ICONSET/icon-29x29@3x.png" Payload/NestKeep.app/AppIcon29x29@3x.png
          cp "$ICONSET/icon-1024x1024@1x.png" Payload/NestKeep.app/AppIcon1024x1024.png
          ls -la Payload/NestKeep.app/ | grep -i appicon

          codesign --force --sign - Payload/NestKeep.app
          rm -rf build/dd
          zip -r "$IPA_NAME" Payload
          rm -rf Payload
          ls -la "$IPA_NAME"

      # 产物断言：把「包里真实生效的键」打出来并校验，避免出错包（曾发生改名被旧值覆盖）。
      - name: Verify IPA关键键（Bundle ID / 显示名 / scheme 白名单）
        working-directory: ios-app
        run: |
          mkdir -p verify && cd verify
          unzip -q "../$IPA_NAME" -d .
          P="Payload/NestKeep.app/Info.plist"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$P")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$P")
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$P")
          echo "  Bundle ID      : $BID"
          echo "  显示名         : $NAME"
          echo "  版本           : $VER"
          echo "  scheme 白名单  :"
          /usr/libexec/PlistBuddy -c 'Print :LSApplicationQueriesSchemes' "$P"

          fail=0
          if [ "$BID" != "${{ steps.flavor.outputs.bundle_id }}" ]; then
            echo "::error::Bundle ID 不符：期望 ${{ steps.flavor.outputs.bundle_id }}，实际 $BID（会导致覆盖安装！）"
            fail=1
          fi
          if [ "$NAME" != "${{ steps.flavor.outputs.display_name }}" ]; then
            echo "::error::显示名不符：期望 ${{ steps.flavor.outputs.display_name }}，实际 $NAME"
            fail=1
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print :LSApplicationQueriesSchemes' "$P" | grep -q apple-magnifier; then
            echo "::error::缺少 LSApplicationQueriesSchemes: apple-magnifier"
            fail=1
          fi
          cd .. && rm -rf verify
          exit $fail

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NestKeep-ipa-${{ env.FLAVOR }}
          path: ios-app/${{ env.IPA_NAME }}
          retention-days: 90

      - name: Create Release (dispatch only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.make_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nestkeep-${{ env.FLAVOR }}-ipa-${{ github.run_number }}"
          gh release create "$TAG" "ios-app/${{ env.IPA_NAME }}" \
            --title "NestKeep ${FLAVOR} IPA #${{ github.run_number }}" \
            --notes "原生 iOS App（${{ env.FLAVOR }} 变体，显示名「${{ steps.flavor.outputs.display_name }}」，Bundle ID ${{ steps.flavor.outputs.bundle_id }}）。产物 ${{ env.IPA_NAME }}。用 TrollStore 打开该 IPA 安装（会重新签名、永久驻留）。"

      - name: Publish semantic version release (for in-app update check)
        # push 到 native-ios-app（原生 App 主分支）或手动 dispatch 都发语义版本 Release，
        # 供 App 内「检查更新」识别。main 分支是 Web 后端，不改动原生 App，不发版。
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'native-ios-app'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.version.outputs.app_version }}"
          SUFFIX="${{ steps.version.outputs.tag_suffix }}"
          # 若目标 tag 已存在（例如同一版本重复构建），跳过发版而不是报错中断
          if gh release view "v$V$SUFFIX" >/dev/null 2>&1; then
            echo "==> tag v$V$SUFFIX 已存在，跳过发版（避免重复）"
            exit 0
          fi
          gh release create "v$V$SUFFIX" "ios-app/${{ env.IPA_NAME }}" \
            --title "NestKeep ${FLAVOR} v$V" \
            --notes "原生 iOS App（$FLAVOR 变体）v$V（${{ env.IPA_NAME }}）。显示名「${{ steps.flavor.outputs.display_name }}」，Bundle ID ${{ steps.flavor.outputs.bundle_id }}，与另一变体可同时安装。用 TrollStore 打开 IPA 覆盖安装（同变体才会覆盖）。"
