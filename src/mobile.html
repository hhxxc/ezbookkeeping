    <style>
        body { margin: 0; background: #f6f6f8; }
        @media (prefers-color-scheme: dark) { body { background: #1a1a1e; } }
        .ebk-splash {
            display: flex; align-items: center; justify-content: center;
            height: 100vh;
        }
        .ebk-splash-spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(0,0,0,0.08);
            border-top-color: #07c160;
            border-radius: 50%;
            animation: ebk-spin .8s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
        }
        @media (prefers-color-scheme: dark) {
            .ebk-splash-spinner { border-color: rgba(255,255,255,0.08); border-top-color: #07c160; }
        }
        @keyframes ebk-spin {
            to { transform: rotate(360deg); }
        }
    </style>
