<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui, viewport-fit=cover"/>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="theme-color" content="#f6f6f8">
    <meta name="format-detection" content="telephone=no"/>
    <title>巢记 · 离线诊断</title>
    <!--
      巢记 iOS 离线诊断 / 设置页（本地打包模式）

      本页由构建脚本复制到 dist/shell-diag.html，作为 Capacitor 的 errorPath
      （本地网页加载失败时兜底显示）。本地打包（IPA 内含完整前端）时，App 直接加载
      包内的 Vue 应用；只有当 Vue 应用无法启动时才会落到这里。

      页面职责：
        1. 探测已配置的后端地址（优先用构建时注入的 window.EZBOOKKEEPING_SERVER_SETTINGS，
           其次用用户之前在壳里保存的 localStorage 地址）是否可达；
        2. 可达 → 自动跳回应用（/）；
        3. 不可达 → 显示设置面板，让用户输入 NAS 后端地址，保存后回跳应用。

      连续点击 3 次 logo 可随时打开设置面板。
    -->
    <style>
        :root {
            --brand: #26a69a;
            --bg: #f6f6f8;
            --fg: #1a1a1a;
            --fg-dim: #8a8a8e;
            --card: #ffffff;
            --line: rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --fg: #ffffff;
                --fg-dim: #8e8e93;
                --card: #1c1c1e;
                --line: rgba(255, 255, 255, 0.12);
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom) 24px;
            overflow: hidden;
        }

        .logo {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            user-select: none;
            -webkit-user-drag: none;
        }

        .title {
            margin-top: 16px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .status {
            margin-top: 22px;
            font-size: 14px;
            color: var(--fg-dim);
            min-height: 20px;
            text-align: center;
            line-height: 1.5;
        }

        .spinner {
            margin-top: 18px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--line);
            border-top-color: var(--brand);
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden { display: none !important; }

        #setup {
            width: 100%;
            max-width: 420px;
            margin-top: 24px;
        }

        .hint {
            font-size: 13px;
            color: var(--fg-dim);
            line-height: 1.6;
            margin-bottom: 10px;
        }

        input[type=url] {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            color: var(--fg);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type=url]:focus { border-color: var(--brand); }

        .row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        button {
            flex: 1;
            padding: 12px 14px;
            font-size: 15px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--fg);
            font-family: inherit;
        }

        button.primary {
            background: var(--brand);
            border-color: var(--brand);
            color: #fff;
            font-weight: 600;
        }

        button:active { opacity: 0.7; }

        #log {
            margin-top: 14px;
            width: 100%;
            max-height: 30vh;
            overflow: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11px;
            line-height: 1.6;
            color: var(--fg-dim);
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
<img id="logo" class="logo" src="img/nestkeep-logo-512.png" alt="巢记"/>
<div class="title">巢记</div>
<div class="status" id="status">正在检查后端…</div>
<div class="spinner" id="spinner"></div>

<div id="setup" class="hidden">
    <div class="hint">无法连接后端。请填写你的 NAS 上 ezbookkeeping 的地址（不需要结尾的斜杠）。保存后会重新打开应用。</div>
    <input id="serverInput" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://example-server.invalid"/>
    <div class="row">
        <button class="primary" id="saveBtn">保存并打开</button>
        <button id="defaultBtn">恢复默认</button>
    </div>
    <div class="row">
        <button id="clearBtn">清除缓存并重试</button>
    </div>
    <div id="log"></div>
</div>

<script>
    (function () {
        'use strict';

        var STORAGE_KEY = 'nestkeep.shell.apiBaseUrl';
        var BUILD_DEFAULT = 'https://example-server.invalid';
        var PROBE_TIMEOUT_MS = 4500;

        var elStatus = document.getElementById('status');
        var elSpinner = document.getElementById('spinner');
        var elSetup = document.getElementById('setup');
        var elServerInput = document.getElementById('serverInput');
        var elLog = document.getElementById('log');
        var elLogo = document.getElementById('logo');

        var logoClicks = 0;
        var logoTimer = null;
        var navigating = false;

        function normalizeBase(url) {
            if (!url) {
                return '';
            }

            var value = String(url).trim();

            if (!value) {
                return '';
            }

            if (value.indexOf('://') < 0) {
                value = 'https://' + value;
            }

            return value.replace(/\/+$/, '');
        }

        // 优先：构建时注入的全局；其次：用户之前在壳里保存的地址；兜底：硬编码默认
        function currentBase() {
            try {
                var injected = window.EZBOOKKEEPING_SERVER_SETTINGS &&
                    window.EZBOOKKEEPING_SERVER_SETTINGS.apiBaseUrl;

                if (injected) {
                    var n = normalizeBase(injected);
                    if (n) {
                        return n;
                    }
                }
            } catch (e) {
                // ignore
            }

            try {
                var saved = window.localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    var s = normalizeBase(saved);
                    if (s) {
                        return s;
                    }
                }
            } catch (e) {
                // ignore
            }

            return BUILD_DEFAULT;
        }

        function saveBase(base) {
            try {
                if (base) {
                    window.localStorage.setItem(STORAGE_KEY, base);
                } else {
                    window.localStorage.removeItem(STORAGE_KEY);
                }
            } catch (e) {
                // ignore
            }
        }

        function log(message) {
            elLog.textContent += (elLog.textContent ? '\n' : '') + message;
            elLog.scrollTop = elLog.scrollHeight;
        }

        function setStatus(text) {
            elStatus.textContent = text;
        }

        function showSetup(message) {
            elSpinner.classList.add('hidden');
            setStatus(message || '无法连接后端');
            elSetup.classList.remove('hidden');
            elServerInput.value = currentBase();
            elServerInput.focus();
        }

        function hideSetup() {
            elSetup.classList.add('hidden');
            elLog.textContent = '';
        }

        function enterApp() {
            if (navigating) {
                return;
            }

            navigating = true;
            setStatus('已连接，正在打开应用…');
            elSpinner.classList.remove('hidden');
            window.location.replace('/');
        }

        function probe(base) {
            return new Promise(function (resolve) {
                var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
                var timer = setTimeout(function () {
                    if (controller) {
                        controller.abort();
                    }
                    resolve(null);
                }, PROBE_TIMEOUT_MS);

                var options = {
                    method: 'GET',
                    cache: 'no-store',
                    headers: { 'Accept': 'application/json' }
                };

                if (controller) {
                    options.signal = controller.signal;
                }

                fetch(base + '/healthz.json', options).then(function (response) {
                    clearTimeout(timer);
                    resolve(response.ok ? base : null);
                }).catch(function (error) {
                    clearTimeout(timer);
                    log(base + ' -> ' + (error && error.message ? error.message : '连接失败'));
                    resolve(null);
                });
            });
        }

        function connect(autoEnter) {
            if (navigating) {
                return;
            }

            if (!autoEnter) {
                hideSetup();
                elSpinner.classList.remove('hidden');
            }

            elLog.textContent = '';
            var base = currentBase();
            setStatus('正在连接 ' + base + ' …');
            log('尝试 ' + base);

            probe(base).then(function (ok) {
                if (navigating) {
                    return;
                }

                if (ok) {
                    enterApp();
                } else if (autoEnter) {
                    // 自动检测阶段连不上，交给用户手动设置
                    showSetup('连不上后端 ' + base);
                } else {
                    showSetup('连不上后端 ' + base);
                }
            });
        }

        elLogo.addEventListener('click', function () {
            logoClicks++;

            if (logoTimer) {
                clearTimeout(logoTimer);
            }

            logoTimer = setTimeout(function () {
                logoClicks = 0;
            }, 700);

            if (logoClicks >= 3) {
                logoClicks = 0;
                showSetup('后端地址设置');
            }
        });

        document.getElementById('saveBtn').addEventListener('click', function () {
            var base = normalizeBase(elServerInput.value);

            if (!base) {
                elServerInput.focus();
                return;
            }

            saveBase(base);
            connect(false);
        });

        document.getElementById('defaultBtn').addEventListener('click', function () {
            saveBase('');
            elServerInput.value = BUILD_DEFAULT;
            connect(false);
        });

        document.getElementById('clearBtn').addEventListener('click', function () {
            try {
                window.localStorage.clear();
            } catch (e) {
                // ignore
            }

            if (window.caches && window.caches.keys) {
                window.caches.keys().then(function (names) {
                    return Promise.all(names.map(function (name) {
                        return window.caches.delete(name);
                    }));
                }).catch(function () {
                    // ignore
                });
            }

            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                navigator.serviceWorker.getRegistrations().then(function (registrations) {
                    registrations.forEach(function (registration) {
                        registration.unregister();
                    });
                }).catch(function () {
                    // ignore
                });
            }

            saveBase('');
            elServerInput.value = BUILD_DEFAULT;
            connect(false);
        });

        // 自动检测：先尝试连接已配置的后端，连上就直接进应用
        connect(true);
    })();
</script>
</body>
</html>
